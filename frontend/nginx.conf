server {
    listen 80;
    server_name _;

    # Static SPA
    root /usr/share/nginx/html;
    index index.html;

    # The browser hits relative URLs like /api/... and nginx forwards them
    # to the `api` service on the Compose network. Agent 1's Spring Boot
    # listens on 8080 (matches application.yml `server.port: ${API_PORT:8080}`).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback: any unknown path returns index.html so client-side
    # routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
