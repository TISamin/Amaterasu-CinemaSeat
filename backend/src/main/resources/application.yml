server:
  port: ${API_PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

spring:
  application:
    name: cinemaseat-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/cinemaseat}
    username: ${POSTGRES_USER:cinemaseat}
    password: ${POSTGRES_PASSWORD:cinemaseat}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 4
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Hold TTL in seconds. Judges will override this with a short value.
hold:
  ttl-seconds: ${HOLD_TTL_SECONDS:120}

# Gateway URL (used by Agent 2). Kept here for shared env contract.
gateway:
  url: ${GATEWAY_URL:http://gateway:9000}
  secret: ${GATEWAY_SECRET:z2p-2026-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true

logging:
  level:
    root: INFO
    com.cinemaseat: DEBUG
    org.hibernate.SQL: WARN
